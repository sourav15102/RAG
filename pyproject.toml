[project]
name = "rag"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "elasticsearch>=8.0,<9.0",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "sentence-transformers>=5.6.0",
]

[project.optional-dependencies]
dev = ["pytest"]
qdrant = ["qdrant-client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
