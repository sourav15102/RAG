[project]
name = "rag"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "elasticsearch>=9.4.1",
    "qdrant-client>=1.18.0",
    "sentence-transformers>=5.6.0",
]

[project.optional-dependencies]
dev = ["pytest"]
qdrant = ["qdrant-client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
